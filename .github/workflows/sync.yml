name: Sincroniza Pipefy -> Google Agenda

on:
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 minutos
  workflow_dispatch:         # permite rodar na mao pelo botao do GitHub

# Evita que duas rodadas se atropelem se uma demorar mais que o normal.
concurrency:
  group: pipefy-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Montar a credencial do Google
        env:
          GOOGLE_SA_JSON_CONTENT: ${{ secrets.GOOGLE_SA_JSON }}
        run: printf '%s' "$GOOGLE_SA_JSON_CONTENT" > service-account.json

      - name: Rodar a sincronizacao
        env:
          PIPEFY_CLIENT_ID: ${{ secrets.PIPEFY_CLIENT_ID }}
          PIPEFY_CLIENT_SECRET: ${{ secrets.PIPEFY_CLIENT_SECRET }}
          PIPEFY_TOKEN_URL: "https://app.pipefy.com/oauth/token"
          PIPEFY_PIPE_ID: "302422931"
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
          GOOGLE_SA_JSON: service-account.json
        run: python sync.py
